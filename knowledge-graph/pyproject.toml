[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Knowledge graph using Neo4J"
readme = "README.md"
authors = [
    { name = "Arvind Singh Rawat", email = "arvind160102261@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-neo4j>=0.11.0",
    "langchain-ollama>=1.1.0",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[tool.uv.tasks]
setup-env = "cp -n .env.example .env"
